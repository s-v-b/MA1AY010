project: 
  output-dir: _slides


format: 
  revealjs:
    theme: [default, "custom-rladies.scss"]
    # logo: /images/logo.png
    footer: "[MA1AU015](http://s-v-b.github.io/MA1AU015) -- Probabilités et Extrêmes -- M1 ISIFAR -- UParis Cité"

    smaller: false
    highlight-style: github-dark
    
    code-fold: false
    code-link: true
    code-annotations: hover

    slide-number: c/t
    show-slide-number: all
    scrollable: true
    preview-links: true
    navigation-mode: vertical
    controls-layout: bottom-right
    controls-tutorial: true
    lang: en-US

    subtitle: "[Probabilités ISIFAR](https://s-v-b.github.io/MA1AU015/)"
    author: Équipe de Statistique 
    institute: "[LPSM Université Paris-Cité](https://u-paris.fr)"

    link-external-icon: true
    link-external-newwindow: true


    header-logo: /images/logo.png
    header-logo-link: "https://u-paris.fr"


    title-slide-attributes:
      data-background-color: "#1c191c"
  
    include-in-header:
      text: |
        <script>
        MathJax = {
          loader: {
            load: ['[tex]/boldsymbol']
          },
          tex: {
            tags: "all",
            inlineMath: [['$','$'], ['\\(','\\)']],
            displayMath: [['$$','$$'], ['\\[','\\]']],
            processEscapes: true,
            processEnvironments: true,
            packages: {
              '[+]': ['boldsymbol']
            }
          }
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>



filters:
  - reveal-header
  - callouty-theorem

execute: 
  echo: true
  eval: false

toc: true
center: true
toc-depth: 1
output-location: fragment
toc-title: Roadmap

engine: jupyter





callouty-theorem:
  thm:
    override-title: false 
    callout: 
      type: note
      appearance: minimal
  prp:
    override-title: false
    callout:
      type: note
      appearance: minimal
  def:
    override-title: false 
    callout: 
      type: note
      appearance: minimal
  lem:
    override-title: false
    callout:
      type: note
      appearance: minimal
#   cor:
#     override-title: false
#     callout:
#       type: note
#       appearance: minimal
  exr:
    override-title: false
    callout:
      type: tip
      appearance: minimal
  proof: 
    override-title: false
    callout:
      type: note
      appearance: minimal
      collapse: true
      icon: false
